<!doctype html>
<html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="stile.css">
<style>
  .stage { margin-top: 46px; gap: 40px; }
  .window { width: 980px; flex: none; position: relative; align-self: center; }
  .sheet tr.sec td { background: var(--teal-light); color: var(--teal-dark); font-weight: 800; }
  .sheet td.calc { background: var(--teal-bg); font-weight: 800; }
  .body { padding: 0 !important; position: relative; }
  .sheet td { white-space: normal; font-size: 25px; padding: 16px 16px; }
  .sheet td.lab { font-weight: 700; width: 360px; }
  .drop { position: absolute; left: 377px; top: 168px; width: 585px; background: #fff; border: 2px solid var(--teal); border-radius: 10px; box-shadow: 0 18px 40px rgba(15,23,42,.18); font-size: 22px; overflow: hidden; }
  .drop div { padding: 9px 16px; display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid #f1f5f9; }
  .drop div span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drop div span:last-child { font-weight: 800; color: var(--teal-dark); }
  .drop .sel { background: var(--teal-bg); }
  .right { flex: 1; display: flex; flex-direction: column; gap: 22px; justify-content: center; }
  .card { background: #fff; border-radius: 18px; border: 1px solid #c7efe6; padding: 26px 30px; box-shadow: 0 12px 36px rgba(15,118,110,.09); }
  .card .t { font-size: 30px; font-weight: 800; color: var(--teal-dark); }
  .card .d { font-size: 25px; color: #334155; margin-top: 8px; line-height: 1.38; }
</style></head>
<body><div class="canvas">
  <div class="kicker">Impostazioni</div>
  <h1>Si adatta alla tua attività</h1>
  <div class="sub">Scegli dai menu gruppo ATECO, previdenza e aliquota: il foglio ricalcola tutto.</div>
  <div class="stage">
    <div class="window">
      <div class="body"><table class="sheet" id="t"></table><div class="drop" id="drop"></div></div>
      <div id="tabs"></div>
    </div>
    <div class="right" id="cards"></div>
  </div>
</div>
<script src="dati.js"></script><script src="comuni.js"></script>
<script>
  const i = D.impostazioni;
  const righe = [
    ['Attività (gruppo ATECO)', i.attivita],
    ['Previdenza', i.previdenza],
    ['Imposta sostitutiva', i.imposta],
    ['Riduzione contributiva del 35%', 'No'],
    ['Bollo addebitato nei ricavi', 'Sì'],
    [`Contributi versati nel ${D.anno}`, '(facoltativo)'],
  ];
  $('#t').innerHTML = '<tr><th>Voce</th><th>La tua scelta</th></tr>' + righe.map(([a, b]) => `<tr><td class="lab">${a}</td><td class="in">${b}</td></tr>`).join('')
    + '<tr class="sec"><td colspan="2">Valori usati nei calcoli</td></tr>'
    + [['Coefficiente di redditività', pct(i.coeff)], ['Aliquota contributiva', pct(i.aliqC, 2)], ['Aliquota dell\'imposta', pct(D.dashboard.aliquota)]].map(([a, b]) => `<tr><td class="lab">${a}</td><td class="calc">${b}</td></tr>`).join('');
  $('#drop').innerHTML = D.coefficienti.map((c, k) => `<div class="${k === 0 ? 'sel' : ''}"><span>${c.label}</span><span>${pct(c.coeff)}</span></div>`).join('');
  $('#cards').innerHTML = [
    [`${D.coefficienti.length} gruppi di coefficienti`, 'Dal 40% del commercio all\'86% delle costruzioni, con i codici ATECO 2007.'],
    ['5 tipi di previdenza', 'Gestione Separata, anche ridotta, Artigiani, Commercianti, cassa professionale.'],
    ['Imposta al 15% o al 5%', 'Il 5% per i primi cinque anni, se hai i requisiti.'],
    ['Riduzione del 35%', 'Per artigiani e commercianti, esclusa la quota maternità.'],
  ].map(([t, d]) => `<div class="card"><div class="t">${t}</div><div class="d">${d}</div></div>`).join('');
  $('#tabs').innerHTML = tabs('Impostazioni', ['Istruzioni', 'Impostazioni', `Parametri ${D.anno}`, 'Fatture', 'Spese']);
  brand();
</script>
</body></html>
