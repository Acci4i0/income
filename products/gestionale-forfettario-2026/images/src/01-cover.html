<!doctype html>
<html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="stile.css">
<style>
  .canvas { padding: 96px 100px 80px 110px; }
  .stage { margin-top: 0; gap: 60px; height: 100%; }
  .right { min-width: 0; }
  .left { width: 720px; flex: none; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 112px; line-height: 1.0; }
  .sub { font-size: 40px; margin-top: 34px; }
  .pills { display: flex; flex-direction: column; gap: 20px; margin-top: 56px; align-items: flex-start; }
  .right { flex: 1; display: flex; align-items: center; }
  .window { width: 100%; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 20px; }
  .tile .v { font-size: 64px; }
  .chart { margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 6px; }
  .chart h3 { margin: 0 0 6px 6px; font-size: 25px; color: var(--teal-dark); }
  .legend { display: flex; gap: 28px; font-size: 21px; color: #475569; margin: 4px 0 6px 10px; }
  .legend i { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 8px; vertical-align: -2px; }
</style></head>
<body><div class="canvas">
  <div class="stage">
    <div class="left">
      <div class="kicker">Partita IVA forfettaria</div>
      <h1>Gestionale forfettario 2026</h1>
      <div class="sub">Registri le fatture: il foglio stima l'imposta, i contributi INPS, il netto e quanto mettere da parte.</div>
      <div class="pills">
        <div class="pill"><i></i>Excel e Google Sheets</div>
        <div class="pill"><i></i>Coefficienti e INPS 2026</div>
        <div class="pill"><i></i>Scadenze F24 e soglie</div>
      </div>
    </div>
    <div class="right">
      <div class="window">
        <div class="body">
          <div class="wtitle" id="t"></div>
          <div class="wsub" id="s"></div>
          <div class="tiles" id="tiles"></div>
          <div class="chart"><h3>Incassi del mese e quota da accantonare</h3>
            <div class="legend"><span><i style="background:#0f766e"></i>Incassato</span><span><i style="background:#f59e0b"></i>Da accantonare</span></div>
            <div id="g"></div></div>
        </div>
        <div id="tabs"></div>
      </div>
    </div>
  </div>
</div>
<script src="dati.js"></script><script src="comuni.js"></script>
<script>
  const d = D.dashboard;
  $('#t').textContent = `Dashboard ${D.anno}`;
  $('#s').textContent = `${D.impostazioni.nome} · dati di esempio`;
  $('#tiles').innerHTML = [
    [`Incassato nel ${D.anno}`, eur(d.incassato, 0), `${d.incassate} fatture incassate`],
    ['Tasse e contributi stimati', eur(d.totale, 0), `il ${nf(1).format(d.incidenza * 100)}% di quanto incassi`],
    ['Netto stimato', eur(d.netto, 0), `circa ${eur(d.netto / 12, 0)} al mese`],
    [`Soglia di ${nf(0).format(D.soglie.s85)} €`, pct(d.pct85), `mancano ${eur(d.manca85, 0)}`],
  ].map(([l, v, n]) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('');
  $('#g').innerHTML = grafico(888, 400);
  $('#tabs').innerHTML = tabs('Dashboard', ['Impostazioni', 'Fatture', 'Spese', 'Riepilogo mensile', 'Dashboard', 'Scadenze']);
  brand();
</script>
</body></html>
