<!doctype html><html><head><meta charset="utf-8"><style>
/* Etsy ritaglia i lati del banner grande su mobile: marchio e testo al centro, copertine ai lati (decorative). */

body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(120deg,#ecfdf9 0%,#f7f8f6 55%,#eef2ef 100%);position:relative}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px}
.logo{width:210px;height:210px;border-radius:46px;background:#0f766e;color:#fff;display:grid;place-items:center;font-weight:800;font-size:144px;flex:none}

.l{left:120px;transform:translateY(-50%) rotate(-3deg)}
.r{right:120px;transform:translateY(-50%) rotate(3deg)}
