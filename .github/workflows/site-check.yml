# Diagnostica di dominio e sito dall'esterno (il container delle sessioni Claude non raggiunge Internet).
# Si avvia a mano (Actions → "Controllo sito" → Run workflow), ogni lunedì, oppure con un push che modifica
# .github/site-check-domains.txt (un dominio per riga): è il modo per l'operatore, che non può avviare i workflow.
name: "Controllo sito"

on:
  push:
    paths:
      - ".github/site-check-domains.txt"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:
    inputs:
      domain:
        description: "Dominio da controllare (es. nettochiaro.com)"
        required: true
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build locale dello stesso commit (per confrontarlo con il sito online)
        run: node build.mjs
      - name: Diagnostica
        env:
          INPUT_DOMAIN: ${{ inputs.domain }}
        run: |
          set -u
          domains="${INPUT_DOMAIN:-}"
          if [ -z "$domains" ]; then
            domains=$(node -e "const u=require('./site.config.json').baseUrl||''; process.stdout.write(u.replace(/^https?:\/\//,'').replace(/\/.*$/,''))")
            if [ -f .github/site-check-domains.txt ]; then
              domains="$domains $(grep -vE '^\s*(#|$)' .github/site-check-domains.txt | tr '\n' ' ')"
            fi
          fi
          for d in $(printf '%s\n' $domains | sort -u); do
          if ! printf '%s' "$d" | grep -Eq '^[a-z0-9.-]+\.[a-z]{2,}$'; then
            echo "::warning::Dominio non valido: $d"; continue
          fi
          root=$(printf '%s' "$d" | awk -F. '{print $(NF-1)"."$NF}')
          tld=${root##*.}
          out="$RUNNER_TEMP/report.md"
          {
            echo "## Controllo di \`$d\`"
            echo
            echo "### Registrazione (RDAP di \`$root\`)"
            echo '```'
            curl -sS --max-time 20 "https://rdap.org/domain/$root" -L | jq -r '
              "stato: \(.status // [] | join(", "))",
              (.events // [] | .[] | "\(.eventAction): \(.eventDate)"),
              "registrar: \([.entities[]? | select(.roles | index("registrar")) | .vcardArray[1][]? | select(.[0]=="fn") | .[3]] | join(", "))",
              "nameserver: \([.nameservers[]?.ldhName] | join(", "))"
            ' 2>&1 || echo "RDAP non disponibile per .$tld"
            echo '```'
            echo
            echo "### DNS"
            echo '```'
            for t in NS A AAAA CNAME; do echo "$t: $(dig +short "$d" "$t" | tr '\n' ' ')"; done
            echo "www CNAME/A: $(dig +short "www.$d" | tr '\n' ' ')"
            echo '```'
            echo
            echo "### HTTP"
            echo '```'
            for p in / /robots.txt /sitemap.xml /etsy-callback/ /prodotti/; do
              printf '%-14s %s\n' "$p" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "https://$d$p" 2>&1)"
            done
            echo "server: $(curl -sSI --max-time 20 "https://$d/" 2>/dev/null | grep -iE '^(server|cf-ray|x-robots-tag):' | tr '\r\n' '  ')"
            echo "titolo: $(curl -sS --max-time 20 "https://$d/" 2>/dev/null | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')"
            echo "pagina inesistente: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$d/pagina-che-non-esiste/" 2>&1)"
            echo '```'
            sm=$(curl -sS --max-time 20 "https://$d/sitemap.xml" 2>/dev/null | grep -o '<loc>[^<]*' | sed 's/<loc>//')
            if [ -n "$sm" ]; then
              echo
              echo "### Pagine della sitemap e asset"
              echo '```'
              ok=0; ko=0
              for u in $sm; do
                c=$(curl -sS -o "$RUNNER_TEMP/p.html" -w '%{http_code}' --max-time 20 "$u" 2>/dev/null || echo 000)
                if [ "$c" = "200" ]; then ok=$((ok+1)); else ko=$((ko+1)); echo "ERRORE $c $u"; fi
                for a in $(grep -oE '(href|src)="/assets/[^"]+' "$RUNNER_TEMP/p.html" 2>/dev/null | sed -E 's/^(href|src)="//' | sort -u); do
                  ac=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$d$a" 2>/dev/null || echo 000)
                  [ "$ac" = "200" ] || { ko=$((ko+1)); echo "ERRORE asset $ac $a (in $u)"; }
                done
              done
              echo "pagine OK: $ok, errori: $ko"
              echo '```'
            fi
            echo
            echo "### Hosting"
            echo '```'
            echo "http -> https: $(curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}' --max-time 20 "http://$d/" 2>&1)"
            hdr=$(curl -sSI --max-time 20 "https://$d/" 2>/dev/null | tr -d '\r')
            for h in x-content-type-options referrer-policy strict-transport-security; do
              echo "$h: $(printf '%s\n' "$hdr" | grep -i "^$h:" | cut -d' ' -f2- || true)"
            done
            locale=$(grep -oE '/assets/style\.css\?v=[a-f0-9]+' dist/index.html | head -1)
            versione=""
            for i in $(seq 1 18); do
              versione=$(curl -sS --max-time 20 "https://$d/version.txt" 2>/dev/null | head -2 | tr '\n' ' ')
              case "$versione" in "$GITHUB_SHA "*) break ;; esac
              sleep 20
            done
            case "$versione" in
              "$GITHUB_SHA "*) echo "deploy: online il commit ${GITHUB_SHA::7}, branch $(echo "$versione" | cut -d' ' -f2)" ;;
              *) echo "deploy: online NON c'è il commit ${GITHUB_SHA::7} dopo 6 minuti (version.txt: ${versione:-assente})" ;;
            esac
            hdr=$(curl -sSI --max-time 20 "https://$d/" 2>/dev/null | tr -d '\r')
            for h in x-content-type-options referrer-policy strict-transport-security; do
              echo "$h (dopo il deploy): $(printf '%s\n' "$hdr" | grep -i "^$h:" | cut -d' ' -f2- || true)"
            done
            echo "cache asset: $(curl -sSI --max-time 20 "https://$d$locale" 2>/dev/null | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-)"
            curl -sS --max-time 20 "https://$d/" -o "$RUNNER_TEMP/live.html" 2>/dev/null || true
            if cmp -s "$RUNNER_TEMP/live.html" dist/index.html; then
              echo "HTML: identico alla build (Cloudflare non lo modifica)"
            else
              echo "HTML: diverso dalla build. Righe aggiunte online:"
              diff <(tr '>' '\n' < dist/index.html) <(tr '>' '\n' < "$RUNNER_TEMP/live.html") | grep '^>' | head -8 || true
            fi
            echo "certificato: $(echo | openssl s_client -servername "$d" -connect "$d:443" 2>/dev/null | openssl x509 -noout -issuer -enddate 2>/dev/null | tr '\n' ' ')"
            echo "DNSSEC (DS su $root): $(dig +short DS "$root" | head -1)"
            echo '```'
          } > "$out"
          cat "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          done
